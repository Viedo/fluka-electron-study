# Copy to config/windows.local.conf only when these defaults need changing.
# Values are literal text: no shell quoting, variables or inline comments.
# Empty WSL_DISTRO uses the default distribution selected by WSL.
WSL_DISTRO=Ubuntu
# Linux directory containing rfluka and fluka, for example /opt/fluka/bin.
# Prefer an explicit path: wsl --exec does not load the interactive .bashrc.
FLUKA_BIN=
